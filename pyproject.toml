[project]
name = "rs-1"
version = "0.1.0"
description = "RS-1: a small local reranker (Qwen3-Reranker-0.6B) used as a decision model"
requires-python = ">=3.12"
dependencies = [
    "browser-harness==0.1.13",
    "httpx[http2]>=0.28,<1",
    "model2vec>=0.10.0",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]

[project.scripts]
rs1-demo = "rs1.demo_server:main"      # quiz + Wikipedia race, http://127.0.0.1:8804
rs1-browser = "rs1.browser.app:main"   # browser-use app, http://127.0.0.1:8766
rs1-bench = "rs1.browser.bench:main"   # browser benchmark

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rs1"]
